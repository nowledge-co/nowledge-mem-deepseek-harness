name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    name: Test (${{ matrix.os }}, DSH ${{ matrix.host.dsh }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        host:
          - dsh: 0.1.7-rc.1
            cordis: 4.0.4
          - dsh: 0.2.1-alpha.1
            cordis: 4.0.5-alpha.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install DSH 0.1.7 compatibility baseline
        if: matrix.host.dsh == '0.1.7-rc.1'
        run: >-
          npm install --ignore-scripts --no-save --no-package-lock
          @deepseek-ai/cordis@${{ matrix.host.cordis }}
          @deepseek-ai/dsh-llm@${{ matrix.host.dsh }}
          @deepseek-ai/dsh-session@${{ matrix.host.dsh }}
          @deepseek-ai/dsh-session-format-v3-to-v4@${{ matrix.host.dsh }}
      - run: npm test
      - run: npm pack --dry-run
